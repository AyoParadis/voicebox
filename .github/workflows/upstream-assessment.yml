name: Assess upstream updates

on:
  schedule:
    # GitHub cron is weekly; the first step gates this to alternate Mondays.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-assessment
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: jamiepine/voicebox
  SYNC_BRANCH: automation/upstream-sync

jobs:
  assess-upstream:
    if: github.repository == 'AyoParadis/voicebox'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce alternate-week schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run bypassed the alternate-week gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          anchor_seconds=$(date -u --date="2026-08-24 09:17:00" +%s)
          current_seconds=$(date -u +%s)
          elapsed_weeks=$(( (current_seconds - anchor_seconds) / 604800 ))
          if (( elapsed_weeks % 2 == 0 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Biweekly upstream assessment is due." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Alternate week: no upstream assessment due." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out fork main
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and assess upstream
        if: steps.schedule.outputs.should_run == 'true'
        id: assess
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git remote set-url --push upstream DISABLED
          git fetch --no-tags upstream main

          commit_count=$(git rev-list --count HEAD..upstream/main)
          file_count=$(git diff --name-only HEAD..upstream/main | sed '/^$/d' | wc -l | tr -d ' ')
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"
          echo "file_count=$file_count" >> "$GITHUB_OUTPUT"

          if [[ "$commit_count" == "0" ]]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Upstream assessment"
              echo
              echo "Fork already contains every commit from \`${UPSTREAM_REPOSITORY}:main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_updates=true" >> "$GITHUB_OUTPUT"
          git diff --name-only HEAD..upstream/main > /tmp/upstream-files.txt
          risk="standard"
          if grep -Eq '^(\.github/(workflows|actions)/|backend/(database|models|migrations|security)|backend/requirements|package\.json$|bun\.lock$|scripts/|tauri/src-tauri/(Cargo\.toml|Cargo\.lock))' /tmp/upstream-files.txt; then
            risk="high"
          fi
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream assessment"
            echo
            echo "- Incoming commits: **${commit_count}**"
            echo "- Changed files: **${file_count}**"
            echo "- Static risk classification: **${risk}**"
            echo
            echo "### Incoming commits"
            git log --format='- `%h` %s' HEAD..upstream/main
            echo
            echo "A draft PR will be created only after a conflict-free merge and safety checks."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt conflict-free merge
        if: steps.assess.outputs.has_updates == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH" main

          set +e
          git merge --no-edit upstream/main
          merge_status=$?
          set -e
          if [[ "$merge_status" != "0" ]]; then
            conflict_files=$(git diff --name-only --diff-filter=U | sed '/^$/d')
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Manual merge required"
              echo
              echo "Upstream cannot be merged automatically. No branch was pushed and no PR was created."
              echo
              echo '```text'
              printf '%s\n' "$conflict_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.assess.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies without lifecycle scripts
        if: steps.assess.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run safety checks
        if: steps.assess.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q backend
          bun run typecheck
          bun run build:web

      - name: Push assessed branch and open or update draft PR
        if: steps.assess.outputs.has_updates == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RISK: ${{ steps.assess.outputs.risk }}
          COMMIT_COUNT: ${{ steps.assess.outputs.commit_count }}
          FILE_COUNT: ${{ steps.assess.outputs.file_count }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git

          remote_sha=$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${SYNC_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

          {
            echo "## Automated upstream assessment"
            echo
            echo "This draft merges \`${UPSTREAM_REPOSITORY}:main\` into this fork after a conflict-free local merge."
            echo
            echo "- Incoming commits: **${COMMIT_COUNT}**"
            echo "- Changed files: **${FILE_COUNT}**"
            echo "- Static risk classification: **${RISK}**"
            echo "- Python syntax compilation: **passed**"
            echo "- Frontend typecheck: **passed**"
            echo "- Web build smoke test: **passed**"
            echo
            echo "### Incoming commits"
            git log --format='- `%h` %s' main..upstream/main
            echo
            echo "> This PR is intentionally draft. Review changed files and normal PR checks before marking it ready or merging."
          } > /tmp/upstream-pr.md

          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: assess and sync upstream Voicebox" \
              --body-file /tmp/upstream-pr.md
            pr_url=$(gh pr view "$existing_pr" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          else
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: assess and sync upstream Voicebox" \
              --body-file /tmp/upstream-pr.md)
          fi

          {
            echo
            echo "Draft PR: ${pr_url}"
            echo "No automatic merge was enabled."
          } >> "$GITHUB_STEP_SUMMARY"
